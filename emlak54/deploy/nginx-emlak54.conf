# NGINX LOCATION FRAGMENT — merge into the site's existing server {} block (site kök dizinde kurulu varsayılır).
# Do not paste a second server block over an existing hosting configuration.

# Hata sayfası: bulunamayan adresler temalı 404 sayfasına gider.
error_page 404 /404.php;

# Eski statik adresler ve kanonik ilan adresleri (/index.php yinelemesini canonical etiketi çözer).
location = /index.html { return 301 /; }
location = /hakkimizda.html { return 301 /hakkimizda.php; }
location = /iletisim.html { return 301 /iletisim.php; }
location ~ ^/ilanlar/([a-z0-9-]+)\.html$ { return 301 /ilan/$1/; }
location ~ ^/ilan/([a-z0-9-]+)$ { return 301 /ilan/$1/; }
location ~ ^/ilan/([a-z0-9-]+)/$ { rewrite ^/ilan/([a-z0-9-]+)/$ /ilan.php?slug=$1 last; }
location = /sitemap.xml { rewrite ^ /sitemap.php last; }
location = /robots.txt { rewrite ^ /robots.php last; }

# Hassas kaynak, veri ve uygulama klasörleri asla doğrudan sunulmaz.
location = /config.php { deny all; }
location = /properties.json { deny all; }
location ~ /\.(?!well-known/) { deny all; }
location ~* ^/(?:database|includes|partials|templates|storage|api|deploy)/ { deny all; }
location ~* \.(?:md|sql|conf|lock|log|bak|old|orig|swp|dist|ini|sh|tpl|ya?ml|env)$ { deny all; }

# Yüklemeler: yalnızca görseller; betik çalıştırma kesinlikle kapalı.
location ^~ /uploads/ {
    location ~* ^/uploads/(?:properties|branding)/[a-z0-9_-]+\.(?:webp|jpe?g|png|avif)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
        expires 30d;
        try_files $uri =404;
    }
    return 404;
}

# Sürümlenmiş (?v=) CSS/JS ve görseller uzun süre önbelleğe alınabilir.
location ~* \.(?:css|js|svg|webp|jpe?g|png|avif|woff2?)$ { expires 30d; access_log off; try_files $uri =404; }

# Bilinmeyen adresler 404.php'ye; normal PHP dosyaları FastCGI'ya.
location / { try_files $uri $uri/ /404.php; }

# The global server configuration still needs a normal `location ~ \.php$` FastCGI handler
# (fastcgi_intercept_errors off), a correct `root`, HTTPS, and the PHP-FPM socket of your host.
# Check the hosting provider's NGINX/PHP-FPM docs before applying.
