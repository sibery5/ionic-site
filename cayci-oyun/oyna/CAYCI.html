 çok bahşiş demek ama tepsi ağırlaştıkça huysuzlaşır, kulenin üst katı devrilebilir. Bahşişler tepsideki kavanoza girer ve ancak ocağa dönünce kasaya geçer. Tepsi uçarsa kavanoz da gider. Altın balonlu VIP siparişleri ×3, kırmızı acele siparişleri ×2 öder; kusursuz teslimler çarpanı büyütür. Son 20 saniye çay saatidir: siparişler yağar, bahşişler ×1,5.",en:"The tray swings from your hand like a pendulum; a clean swing never spills, sudden stops and bumps do. Fill as many glasses as you dare at the stove: more glasses means bigger tips, but a heavy tray gets wild and the upper tower can topple. Tips go into the jar on your tray and are only banked when you return to the stove. Crash and the jar goes with it. Gold-bubble VIP orders pay ×3, red rush orders ×2, and perfect deliveries grow your multiplier. The last 20 seconds are tea time: orders pour in and tips pay ×1.5."},rulesGossip:{tr:`Dedikodu: VIP'ler ve memnun müşteriler kulağına laf fısıldar, hepsi cep defterine yazılır. Mor balonlu müşteri "dedikodu var mı?" diye sorar: çayını götürünce defterinden bir laf seç. Doğru laf doğru kişiye: bahşiş, itibar ve han tarafına kanıt. Ama dikkat: falcının ve hayalperestin lafları yalan çıkabilir, kimseye kendi dedikodusunu anlatma, alakasız laf da can sıkar. Kızan müşteri bardağını kırar ya da masasından kalkıp seni kovalar; Rıza Usta'nın ocağına kaçarsan kurtulursun. Han tarafı doğru lafı alınca "başka?" diye üsteler. Hakkında konuştuğun kişi aynı kattaysa duyup peşine düşebilir. Selim'ler iki kat para öder ama bu ihanettir.`,en:`Gossip: VIPs and happy customers whisper things in your ear, and it all goes into your pocket notebook. A purple-bubble customer asks "any gossip?": deliver their tea and pick something from your notebook. The right gossip to the right person means tips, reputation and evidence for the han. But careful: the psychic's and the dreamer's tales may be lies, never tell people gossip about themselves, and irrelevant talk annoys. An angry customer smashes a glass or gets up and chases you; run to Master Rıza's stove to be safe. The han side asks "anything else?" when you tell them the right thing. If the person you gossip about sits on the same floor, they may hear it and come after you. Selim's lot pay double, but that is betrayal.`},rulesAnger:{tr:"Sinir: yolunu kesen, tepsine çarpan, ayağına dolanan oldukça sinir göstergen dolar. Dolunca R ile tepsiyle vurabilirsin... ama patron Nadir Bey kameralardan izliyor. İtibarın düşer, üçüncüsünde maaşından keser. Bazen de bizzat teftişe çıkar: o kattayken kusursuz teslimleri görür, kırılan bardağı da görür. Teftişten iyi geçersen bahşiş bırakır. Ona vurmayı aklından bile geçirme.",en:"Anger: people blocking your way, bumping your tray and tripping you fill your anger meter. When it is full you can bonk them with the tray using R... but Nadir Bey is watching the cameras. Your reputation drops, and on the third time he docks your pay. Sometimes he inspects the floor in person: he sees every perfect delivery and every broken glass. Pass and he leaves you a tip. Do not even think about bonking him."},rulesRise:{tr:"Yükseliş: yıldız topladıkça, itibarın arttıkça ve kanıtları doğru yere ulaştırdıkça terfi edersin: Çırak → Ocakçı → Kat Çaycısı → Baş Çaycı → Han Çaycıbaşı → Çay Ocağı Patronu. Her unvan vardiya başına maaş getirir.",en:"The rise: earn stars, build your reputation and get the evidence to the right people to be promoted: Apprentice → Stove Keeper → Floor Tea Boy → Head Tea Boy → Chief of Tea → Boss of the Tea House. Every title pays a salary per shift."},controls:{tr:[["W A S D","Yürü"],["Fare","Etrafına bak"],["Shift","Koş (tepsi daha çok sallanır)"],["Ctrl / C","Parmak ucunda yürü (yavaş ama güvenli)"],["E (ocakta basılı tut)","Demli çay doldur"],["Q (ocakta basılı tut)","Açık çay doldur (1. kattan itibaren)"],["E (masada)","Teslim et"],["F, sonra yeşilde F","Fırıldak: sonraki teslim ×2"],["Boşluk","Tepsiyi kaldır (kalabalıktan geç)"],["R (sinir dolunca)","Tepsi ,wants:["tapu","rapor"],whispers:[]},remzi:{name:{tr:"Bekçi Remzi",en:"Remzi the Watchman"},side:"neutral",wants:["kulis","kedi"],whispers:["f_hayalet"]},cevdet:{name:{tr:"Kâtip Cevdet",en:"Cevdet the Clerk"},side:"villain",wants:["tapu","foto"],whispers:[]}},ei=[{id:"hayri_tapu",topic:"tapu",source:"hayri",about:["selim"],truth:!0,story:!0,value:30,text:{tr:`"Selim dün yine gelmiş, hanın tapusunu sormuş. Nadir Bey'e söylemedim..."`,en:`"Selim came by again yesterday asking about the deed. I didn't tell Nadir Bey..."`}},{id:"sevim_evrak",topic:"tapu",source:"sevim",about:["selim"],truth:!0,story:!0,value:30,text:{tr:`"KriptoBey'den biri yüz tane damgalı kâğıt aldı. Ne yapacaklar o kadar resmî kâğıdı?"`,en:'"Someone from KriptoBey bought a hundred stamped forms. What do they need that much paperwork for?"'}},{id:"ferhat_vekalet",topic:"tapu",source:"ferhat",about:["selim"],truth:!0,story:!0,value:40,text:{tr:`"Cuma günü han için bir satış vekâletnamesi randevusu var. Ama Nadir Bey'in haberi yok gibi."`,en:`"There's an appointment Friday for a power of attorney to sell the han. Nadir Bey doesn't seem to know."`}},{id:"fikret_borc",topic:"para",source:"fikret",about:["selim"],truth:!0,story:!0,value:35,text:{tr:`"KriptoBey'in hesapları eksi. Bu çocuk han satılmazsa batar."`,en:`"KriptoBey's books are deep in the red. That kid goes bust unless the han gets sold."`}},{id:"rifat_rapor",topic:"rapor",source:"rifat",about:["gokdelen"],truth:!0,story:!0,value:40,text:{tr:`"Bir bilirkişi raporu imzalatacaklarmış: 'bina çürük' diye. Bina sağlam oysa."`,en:`"They want to get an expert report signed saying the building is unsound. It's perfectly sound."`}},{id:"nevin_fal",topic:"rapor",source:"nevin",about:[],truth:!1,story:!1,value:15,text:{tr:'"Fincanda gördüm: kule gibi bir bina, altında bir kedi ağlıyor. Han yıkılacak çocuğum."',en:'"I saw it in the cup: a tower of a building and a crying cat beneath it. The han will fall, child."'}},{id:"lale_foto",topic:"foto",source:"lale",about:["selim","turgut"],truth:!0,story:!0,value:45,text:{tr:`"Selim ile Emlakçı Turgut'u gece hanın önünde ölçü alırken çektim. Fotoğraf bende."`,en:'"I photographed Selim and Turgut the realtor taking measurements outside the han at night. I have the photo."'}},{id:"selim_telefon",topic:"tapu",source:"selim",about:["selim"],truth:!0,story:!0,value:50,text:{tr:`"Telefonda: 'Amca imzalarsa Cuma AVM'cilere devrederiz, çaycıyı da çıkarırız.'"`,en:`"On the phone: 'If uncle signs, we hand it to the mall people on Friday and kick out the tea boy too.'"`}},{id:"turgut_komisyon",topic:"para",source:"turgut",about:["turgut"],truth:!0,story:!0,value:45,text:{tr:`"AVM şirketi komisyonu peşin yatırdı. Cuma'ya kadar Nadir amcanın imzası lazım."`,en:`"The mall company paid the commission up front. We need old Nadir's signature by Friday."`}},{id:"defne_statik",topic:"rapor",source:"defne",about:[],truth:!0,story:!0,value:35,text:{tr:`"Binanın statik hesabını geçen yıl ben yaptım. Sapasağlam. 'Çürük' diyen yalan söylüyor."`,en:`"I did the building's structural survey last year. Rock solid. Whoever says 'unsound' is lying."`}},{id:"nadir_rapor",topic:"rapor",source:"nadir",about:["nadir","selim"],truth:!0,story:!0,value:40,text:{tr:'"Selim bana bir rapor getirdi, bina çürükmüş. İmzalayayım mı bilmiyorum evlat."',en:`"Selim brought me a report saying the building is rotten. I don't know whether to sign, kid."`}},{id:"gokdelen_bilirkisi",topic:"rapor",source:"gokdelen",about:["gokdelen"],truth:!0,story:!0,value:50,text:{tr:'"Raporu hazırlayan bilirkişi bizim adamımız. Bina sapasağlam aslında."',en:'"The expert who wrote the report is our man. The building is actually perfectly sound."'}},{id:"gulsum_destek",topic:"kulis",source:"gulsum",about:[],truth:!0,story:!1,value:8,text:{tr:'"Hepimiz arkandayız Cemal. Bildiğini söylersen biz de konuşuruz."',en:'"We all have your back, Cemal. If you speak up, so will we."'}},{id:"f_tabela",topic:"tapu",source:"hayri",about:["turgut"],truth:!0,story:!1,value:20,text:{tr:`"Turgut'un ofisinde kapının arkasında ikinci bir tabela var: 'Gökdelen Yapı'."`,en:`"Behind Turgut's door there's a second sign: 'Skyscraper Corp.'"`}},{id:"f_ask",topic:"kulis",source:"sevim",about:["sukran","ferhat"],truth:!0,story:!1,value:15,text:{tr:`"Şükran Hanım her gün Ferhat Bey'e çay ısmarlıyor. Bir şeyler var bunlarda."`,en:'"Mrs. Şükran buys Mr. Ferhat a tea every single day. Something is going on there."'}},{id:"f_takim",topic:"kulis",source:"sukran",about:["hayri"],truth:!0,story:!1,value:12,text:{tr:`"Hayri Usta, Nadir Bey'in takımının cebini ters dikmiş. Nadir Bey üç aydır fark etmedi."`,en:`"Master Hayri sewed Nadir Bey's suit pocket on upside down. Nadir Bey hasn't noticed in three months."`}},{id:"f_piyango",topic:"para",source:"nevin",about:["gulsum"],truth:!1,story:!1,value:15,text:{tr:'"Gülsüm Abla piyangodan büyük ikramiyeyi vurmuş, paspası da altın kaplatacakmış."',en:'"Gülsüm hit the lottery jackpot and is having her mop gold-plated."'}},{id:"f_hazine",topic:"para",source:"kerem",about:[],truth:!1,story:!1,value:15,text:{tr:`"Hanın bodrumunda Bizans hazinesi varmış abi. NFT'sini yapacağım, zengin olacağız."`,en:`"There's Byzantine treasure in the basement, bro. I'm minting it as an NFT, we'll be rich."`}},{id:"f_vergi",topic:"para",source:"kerem",about:["fikret"],truth:!1,story:!1,value:15,text:{tr:'"Fikret Bey vergi kaçırıyormuş, kesin duydum. Yani biri dedi ki duymuş."',en:'"Mr. Fikret dodges his taxes, I heard it for sure. Well, someone said they heard."'}},{id:"f_balik",topic:"kedi",source:"gulsum",about:["ferhat"],truth:!0,story:!1,value:12,text:{tr:`"Paşa'yı kim şişmanlatıyor biliyor musun? Ferhat Bey. Çekmecesinde hamsi saklıyor."`,en:`"You know who's fattening up Paşa? Mr. Ferhat. He keeps anchovies in his drawer."`}},{id:"saadet_vakif",topic:"tapu",source:"saadet",about:[],truth:!0,story:!0,value:50,text:{tr:'"Hanın asıl tapusu bende, bodrumda. Bu han vakıf malı evlat; kimse tek imzayla satamaz."',en:`"The han's original deed is with me, in the basement. This han belongs to a foundation, kid; nobody can sell it with a single signature."`}},{id:"remzi_gece",topic:"foto",source:"remzi",about:["cevdet","turgut"],truth:!0,story:!0,value:45,text:{tr:`"Gece nöbetteydim. Kâtip Cevdet arşivden bir dosya çıkarıp Turgut'un arabasına koydu. Gözümle gördüm."`,en:`"I was on night watch. Cevdet the clerk took a file from the archive and put it in Turgut's car. I saw it with my own eyes."`}},{id:"cevdet_rusvet",topic:"para",source:"cevdet",about:["cevdet","turgut"],truth:!0,story:!0,value:45,text:{tr:`"(Telefonda) Turgut Bey, tapu dosyası kayıp sayılır. Paramı Cuma'ya kadar yatırın, yoksa bulunur."`,en:'"(On the phone) Turgut Bey, consider the deed file lost. Pay me by Friday, or it gets found."'}},{id:"f_hayalet",topic:"kulis",source:"remzi",about:[],truth:!1,story:!1,value:15,text:{tr:'"Bodrumda gece hayalet dolaşıyor. Kırk yıl önceki çaycının hayaleti, tepsisi hâlâ elinde!"',en:'"A ghost walks the basement at night. The tea boy from forty years ago, still holding his tray!"'}}],Jt=Object.fromEntries(ei.map(i=>[i.id,i])),Jn=6;ei.filter(i=>i.story&&i.truth).map(i=>i.id);const Nl=(i,e)=>`${i}>${e}`;function sh(i,e,t,n){const s=hn[e],a={verdict:"irrelevant",pay:0,rep:0,evidence:!1,burned:!1};if(i.about.includes(e))return{...a,verdict:"aboutThem",rep:-10};if(i.source===e)return{...a,verdict:"own",rep:-1};const r=s.wants.includes(i.topic);if(!i.truth)return r?{...a,verdict:"lie",rep:-8}:{...a,verdict:"irrelevant",rep:-2};if(!r)return{...a,verdict:"irrelevant",rep:-2};if(n.includes(Nl(i.id,e)))return{...a,verdict:"already"};const o=i.topic===t;return s.side==="villain"?{...a,verdict:"betray",pay:Math.round(i.value*2),rep:-15,burned:i.story}:{...a,verdict:"reward",pay:Math.round(i.value*(o?1:.6)),rep:i.story?6:3,evidence:i.story&&s.side==="han"}}function Qo(i){return ei.find(e=>e.source===i&&!hn[i].whispers.includes(e.id))}const jg={"zemin:a":"hayri_tapu","zemin:b":"sevim_evrak","zemi ho:"cemal",text:oe("Sağ olun Nadir Bey. Utandırmam sizi.","Thank you, Nadir Bey. I won't let you down."),mood:"happy"}]},promo_2:{id:"promo_2",set:"ofis",title:oe("Terfi: Kat Çaycısı","Promotion: Floor Tea Boy"),actors:[et.hayri(-1.2,-.4,.4),et.sevim(-.2,-.8,.2),et.rifat(1,-.5,-.4),et.cemal(1.7,.5,0)],lines:[{who:"hayri",text:oe("Cemal geliyor diye kapımı açık bırakıyorum artık.","I leave my door open now, because Cemal is coming."),mood:"happy"},{who:"sevim",text:oe("Kat Çaycısı olmuşsun! Bu işin dedikodusu bol olur, ha?","Floor Tea Boy now! Lots of gossip in this job, eh?"),mood:"happy"},{who:"rifat",text:oe("Bir şey duyarsan bana gel. Tapu, vekâlet, rapor... Doğru bilgi doğru elde işe yarar.","If you hear something, come to me. Deeds, signatures, reports... The right information in the right hands matters.")},{who:"cemal",text:oe("Herkes bir şey biliyor. Kim neyi merak ediyor, onu öğrenmem lazım.","Everyone knows something. I need to learn who wants to know what.")}]},villain:{id:"villain",set:"karanlik",title:oe("Karanlık Ofis","The Dark Office"),actors:[et.selim(-.5,-.4,.5),et.turgut(.7,-.7,-.2),et.cemal(1.7,.5,0)],lines:[{who:"selim",text:oe("Çaycı! Gel bakalım. Kulakların çok iş görüyormuş diye duydum.","Tea boy! Come here. I hear those ears of yours are very busy.")},{who:"selim",text:oe("Duyduğun her şeyi bana getir. Kim ne biliyor, kim ne konuşuyor. İki katını öderim. Bu da peşinatın.","Bring me everything you hear. Who knows what, who says what. I'll pay double. And here is an advance."),beat:"envelope",choice:[{text:oe("Zarfı al (+100₺, itibar düşer)","Take the envelope (+100₺, reputation drops)"),flag:"tookEnvelope",wallet:100,rep:-8,then:[{who:"selim",text:oe("Akıllı çocuk. Cuma'ya kadar kulakların bende.","Smart kid. Until Friday, your ears are mine."),mood:"happy"},{who:"turgut",text:oe("Kazanan tarafa hoş geldin çaycı.","Welcome to the winning side, tea boy."),mood:"happy"}]},{text:oe("Geri çevir","Refuse it"),flag:"refusedEnvelope",rep:4,then:[{who:"cemal",text:oe("Ben çay taşırım Selim Bey. Laf taşımam.","I carry tea, Selim Bey. Not talk.")},{who:"selim",text:oe("Pişman olacaksın çaycı. Cuma yaklaşıyor.","You'll regret this, tea boy. Friday is coming."),mood:"angry"}]},{text:oe("Zarfı al, sonra Rıza Usta'ya götür","Take it, then show it to Master Rıza"),flag:"doubleAgent",wallet:100,then:[{who:"cemal",text:oe("(Zarfı cebime koydum. Üstünde Selim'in el yazısı var. Bu zarf bir kanıt.)","(I pocket the envelope. It has Selim's handwriting on it. This envelope is evidence.)")},{who:"selim",text:oe("Akıllı çocuk.","Smart kid."),mood:"happy"}]}]},{who:"turgut",text:oe("Cuma'dan sonra bu han olmayacak zaten. Tapusu bile kayıp, duymadın mı?","After Friday this han won't exist anyway. Even its deed is lost, didn't you hear?")}]},promo_3:{id:"promo_3",set:"ocak",title:oe("Terfi: Baş Çaycı","Promotion: Head Tea Boy"),actors:[et.nadir(-.8,0,.7),et.riza(-.1,-.6,.2),et.gulsum(1.2,-.4,-.6),et.cemal(1.7,.5,0)],lines:[{who:"nadir",text:oe('Baş Çaycım! Artık herkes "Cemal nerede?" diye soruyor. İhtiyaç duyulan biri oldun.','My Head Tea Boy! Everyone asks "Where is Cemal?" now. People need you.'),mood:"happy"},{who:"gulsum",text:oe("Ben de soruyorum! Yerleri sildiğimde ilk sen basma ama.","I ask too! Just don't be the first to walk on my wet floors.")},{who:"nadir",text:oe("Söyle bakalım evlat, şu Selim'le ilgili bir şey duydun mu? Bir şeyler dönüyor, hissediyorum.","Tell me, kid, have you heard anything about Selim? Something is going on, I can feel it.")},{who:"cemal",text:oe("Duyuyorum Nadir Bey. Ama tam bilmeden konuşmayacağım.","I hear things, Nadir Bey. But I won't talk until I'm sure.")},{who:"riza",text:oe("Aferin. Lafı ancak kanıtla dökersin.","Good. You only spill the talk with proof.")}]},bodrum:{id:"bodrum",set:"arsiv",title:oe("Kayıp Tapu","The Missing Deed"),actors:[et.gulsum(-1.4,-.2,.6),et.saadet(-.3,-.7,.2),et.remzi(.9,-.5,-.4),et.cemal(1.7,.5,0)],lines:[{who:"gulsum",text:oe("Kırk yıldır bu bodrumu ben silerim, arşivin anahtarı da bende. Gel bakalım, Saadet Hanım seni bekliyor.","I've mopped this basement for forty years, and I hold the archive key. Come on, Mrs. Saadet is waiting for you."),mood:"happy"},{who:"saadet",text:oe("Demek Rıza'nın çırağı sensin. Bak evlat: bu han vakıf malı. Asıl tapu şu dolapta.","So you're Rıza's apprentice. Listen, kid: this han belongs to a foundation. The original deed is in that cabinet.")},{who:"saadet",text:oe("Ama Kâtip Cevdet son günlerde dosyaları karıştırıyor. Turgut'la telefonda fısıldaşıyor.","But Cevdet the clerk has been rummaging through the files lately. Whispering on the phone with Turgut.")},{who:"remzi",text:oe("Selim'in zarfını almışsın diyorlar çaycı. Bodrumda laf çabuk yayılır.","They say you took Selim's envelope, tea boy. Talk travels fast in a basement."),if:"tookEnvelope",mood:"angry"},{who:"gulsum",text:oe("Zarfı Rıza'ya götürmüşsün. Rıza anlattı, gururlandık.","You took the envelope to Rıza. He told us; we're proud of you."),if:"doubleAgent",mood:"happy"},{who:"saadet",text:oe("Toplantıya üç gün var. Tapuyu ne yapalım Cemal?","The meeting is in three days. What should we do with the deed, Cemal?"),choice:[{text:oe("Av. Rıfat'a götürelim, toplantıda o göstersin","Take it to Attorney Rıfat; he shows it at the meeting"),flag:"deedToRifat",rep:3,then:[{who:"saadet",text:oe("Doğru karar. Kopyası bende kalsın, aslı Rıfat'ta. Sen de dikkatli taşı.","The right call. I keep a copy, Rıfat keeps the original. Carry it carefully."),mood:"happy"}]},{text:oe("Dolapta kalsın, kilidi değiştirin","Leave it in the cabinet; change the lock"),flag:"deedStays",rep:2,then:[{who:"saadet",text:oe("Peki. Ama Cevdet'e dikkat et; anahtar onda da var.","Alright. But watch Cevdet; he has a key too.")}]},{text:oe("Selim'e satalım (+300₺)","Sell it to Selim (+300₺)"),flag:"soldDeed",wallet:300,rep:-20,then:[{who:"gulsum",text:oe("Cemal! Sen de mi?!","Cemal! You too?!"),mood:"angry"},{who:"saadet",text:oe("Git buradan. Rıza bunu duyunca yıkılacak.","Get out of here. This will break Rıza's heart."),mood:"angry"}]}]},{who:"remzi",text:oe("Gece nöbetinde gördüklerimi bir gün anlatırım. Ama önce çayımı getir, tam demli!","One day I'll tell you what I saw on night watch. But first bring my tea, fully brewed!"),unless:"soldDeed",mood:"happy"}]},promo_4:{id:"promo_4",set:"teras",title:oe("Terfi: Han Çaycıbaşı","Promotion: Chief of Tea"),actors:[et.gulsum(-1.2,-.2,.6),et.nadir(-.2,-.7,.2),et.riza(.9,-.5,-.4),et.cemal(1.7,.5,0)],lines:[{who:"gulsum",text:oe("Han Çaycıbaşı! Paspası bırakıp alkışlayacağım valla.","Chief of Tea! I'm putting down my mop to applaud, honestly."),mood:"happy"},{who:"nadir",text:oe("Cuma günü burada toplantı var. Selim bir rapor getirecek. Senin de orada olmanı istiyorum.","There's a meeting here on Friday. Selim is bringing a report. I want you there.")},{who:"riza",text:oe("Kanıtlarını topla evlat. O gün herkes sana bakacak.","Gather your evidence, kid. That day everyone will be looking at you.")},{who:"riza",text:oe("Selim'in zarfını bana getirdin ya... Saklıyorum. O gün işe yarayacak.","That envelope of Selim's you brought me... I'm keeping it. It will come in handy that day."),if:"doubleAgent",mood:"happy"},{who:"riza",text:oe("Zarfı aldığını duydum. Para gelir geçer evlat, itibar kalır.","I heard you took the envelope. Money comes and goes, kid; your name stays."),if:"tookEnvelope",mood:"angry"}]},meeting:{id:"meeting",set:"teras",title:oe("Han Toplantısı","The Han Meeting"),actors:[et.nadir(-.3,-.9,.1),et.selim(.8,-.6,-.5),et.turgut(1.5,-.2,-.8),et.riza(-1.3,-.3,.6),et.lale(-1.6,.5,1),et.cemal(1.7,.5,0)],lines:[{who:"selim",text:oe("Amca, rapor ortada: bina çürük. İmzala, herkes kurtulsun. Avukatlar bekliyor.","Uncle, the report is clear: the building is rotten. Sign, and everyone is spared. The lawyers are waiting.")},{who:"nadir",text:oe("Bilmiyorum Selim... Kırk yıllık han bu.","I don't know, Selim... This han is forty years old.")},{who:"selim",text:oe("Tapu da zaten bizde. Saadet Hanım'ın dolabı bomboş!","And the deed is ours now. Mrs. Saadet's cabinet is empty!"),if:"soldDeed",mood:"happy"},{who:"nadir",text:oe("Rıfat dün bana hanın asıl tapusunu getirdi Selim. Bu han vakıf malı. Kimse tek imzayla satamaz!","Rıfat brought me the han's original deed yesterday, Selim. This han belongs to a foundation. Nobody can sell it with one signature!"),if:"deedToRifat",mood:"angry"},{who:"selim",text:oe("Çaycı, sen de bir şey söyle. Teklifim hâlâ geçerli.","Tea boy, say something. My offer still stands."),beat:"envelope"},{who:"selim",text:oe("Hem bu çaycı benden para aldı. Onun sözüne kim inanır?","Besides, this tea boy took my money. Who would believe him?"),if:"tookEnvelope",mood:"happy"},{who:"cemal",text:oe("Zarfınız burada Selim Bey. Nadir Bey, yeğeniniz beni satın almaya çalıştı. Üstünde kendi el yazısı var.","Here is your envelope, Selim Bey. Nadir Bey, your nephew tried to buy me. It has his own handwriting on it."),if:"doubleAgent"},{who:"nadir",text:oe("Demek öyle Selim...","So that's how it is, Selim..."),if:"doubleAgent",mood:"angry"},{who:"riza",text:oe("Şimdi senin sıran evlat.","Now it's your turn, kid.")}]},end_saved:{id:"end_saved",set:"teras",title:oe("Patron Cemal","Boss Cemal"),actors:[et.nadir(-.3,-.6,.3),et.riza(-1.2,-.2,.7),et.gulsum(1.1,-.3,-.6),et.lale(1.6,.4,-1),et.cemal(1.7,.5,0)],lines:[{who:"nadir",text:oe("Bu handa herkes sana muhtaç evlat. Ocak artık senin. Patron sensin.","Everyone in this han needs you, kid. The stove is yours now. You're the boss."),beat:"key",mood:"happy"},{who:"riza",text:oe("Tepsiyi de al. Babamdan kalma. Sende daha çok yakışıyor.","Take the tray too. It was my father's. It suits you better."),mood:"happy"},{who:"nadir",text:oe("Vakıf tapusunu da çerçeveletip ocağın üstüne asacağız. Bir daha kimse kaybetmesin.","We'll frame the foundation deed and hang it above the stove. Nobody loses it again."),if:"deedToRifat",mood:"happy"},{who:"gulsum",text:oe("Patron Cemal! İlk çay benden!","Boss Cemal! The first tea is on me!"),mood:"happy"},{who:"cemal",text:oe("Çayı dökmedim, lafı da yerinde döktüm. Ocak açık, herkes buyursun!","I never spilled the tea, and I spilled the talk at the right time. The stove is open, everyone welcome!"),mood:"happy"}]}},Ry={1:"promo_1",2:"promo_2",3:"promo_3",4:"promo_4"},wh=(i,e)=>Object.keys(i.venueStars).length>=i.venueCount&&Object.values(i.venueStars).every(t=>t>=e),hl=[{id:"FIRST_TEA",name:{tr:"İlk Çay",en:"First Tea"},desc:{tr:"İlk bardağı teslim et",en:"Deliver your first glass"},check:i=>i.totals.delivered>=1},{id:"TOWER_8",name:{tr:"Kule",en:"Tower"},desc:{tr:"8 bardakla teslim yap",en:"Deliver while carrying 8 glasses"},check:i=>(i.run?.maxDeliveryTower??0)>=8},{id:"TOWER_12",name:{tr:"Gökdelen",en:"Skyscraper"},desc:{tr:"12 bardakla teslim yap",en:"Deliver while carrying 12 glasses"},check:i=>(i.run?.maxDeliveryTower??0)>=12},{id:"SPIN_1",name:{tr:"Fırıldak",en:"The Spin"},desc:{tr:"İlk Fırıldak",en:"Land your first Spin"},check:i=>i.totals.spins>=1},{id:"SPIN_25",name:{tr:"Döner Usta",en:"Spinning Master"},desc:{tr:"Toplam 25 Fırıldak",en:"Land 25 Spins"},check:i=>i.totals.spins>=25},{id:"COMBO_3",name:{tr:"Beş Yıldızlı Hizmet",en:"Five-Star Service"},desc:{tr:"×3 çarpana ulaş",en:"Reach a ×3 multiplier"},check:i=>(i.run?.maxCombo??0)>=3},{id:"BANK_100",name:{tr:"Kumbara",en:"Piggy Bank"},desc:{tr:"Tek seferde 100₺ kasaya geçir",en:"Bank 100₺ in one trip"},check:i=>(i.run?.maxBank??0)>=100},{id:"RUN_250",name:{tr:"Bahşiş Kralı",en:"Tip King"},desc:{tr:"Bir vardiyada 250₺",en:"Earn 250₺ in one shift"},check:i=>(i.run?.score??0)>=250},{id:"CLEAN_RUN",name:{tr:"Tek Damla Bile",en:"Not a Drop"},desc:{tr:"Kavanoz kaybetmeden ve bardak kırmadan 15+ bardak teslim et",en:"Deliver 15+ glasses without losing the jar or breaking a glass"},check:i=>!!i.run&&i.run.jarsLost===0&&i.run.broken===0&&i.run.delivered>=15},{id:"VIP_5",name:{tr:"Protokol",en:"Protocol"},desc:{tr:"Toplam 5 VIP siparişini kusursuz ver",en:"Serve 5 VIP orders pe
