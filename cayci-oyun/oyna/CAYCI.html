te:{tr:"Rahat: daha affedici tepsi, skor ×0,8 · Usta: sert tepsi, skor ×1,25 · Günlükte hep Normal",en:"Relaxed: forgiving tray, score ×0.8 · Master: harsh tray, score ×1.25 · Daily is always Normal"},camDist:{tr:"Kamera mesafesi",en:"Camera distance"},slip:{tr:"Kaydın!",en:"Slipped!"},trip:{tr:"Paşa!",en:"Paşa!"},controlsTitle:{tr:"Kontroller",en:"Controls"},gamepadTitle:{tr:"Oyun kolu",en:"Gamepad"},rules:{tr:"Tepsi elinin ucunda sarkaç gibi sallanır; düzgün sallanırken çay dökülmez, ani duruş ve çarpışma döker. Ocakta istediğin kadar bardak doldur: çok bardak çok bahşiş demek ama tepsi ağırlaştıkça huysuzlaşır, kulenin üst katı devrilebilir. Bahşişler tepsideki kavanoza girer ve ancak ocağa dönünce kasaya geçer. Tepsi uçarsa kavanoz da gider. Altın balonlu VIP siparişleri ×3, kırmızı acele siparişleri ×2 öder; kusursuz teslimler çarpanı büyütür. Son 20 saniye çay saatidir: siparişler yağar, bahşişler ×1,5.",en:"The tray swings from your hand like a pendulum; a clean swing never spills, sudden stops and bumps do. Fill as many glasses as you dare at the stove: more glasses means bigger tips, but a heavy tray gets wild and the upper tower can topple. Tips go into the jar on your tray and are only banked when you return to the stove. Crash and the jar goes with it. Gold-bubble VIP orders pay ×3, red rush orders ×2, and perfect deliveries grow your multiplier. The last 20 seconds are tea time: orders pour in and tips pay ×1.5."},rulesGossip:{tr:`Dedikodu: VIP'ler ve memnun müşteriler kulağına laf fısıldar, hepsi cep defterine yazılır. Mor balonlu müşteri "dedikodu var mı?" diye sorar: çayını götürünce defterinden bir laf seç. Doğru laf doğru kişiye: bahşiş, itibar ve han tarafına kanıt. Ama dikkat: falcının ve hayalperestin lafları yalan çıkabilir, kimseye kendi dedikodusunu anlatma, alakasız laf da can sıkar. Kızan müşteri bardağını kırar ya da masasından kalkıp seni kovalar; Rıza Usta'nın ocağına kaçarsan kurtulursun. Han tarafı doğru lafı alınca "başka?" diye üsteler. Hakkında konuştuğun kişi aynı kattaysa duyup peşine düşebilir. Selim'ler iki kat para öder ama bu ihanettir.`,en:`Gossip: VIPs and happy customers whisper things in your ear, and it all goes into your pocket notebook. A purple-bubble customer asks "any gossip?": deliver their tea and pick something from your notebook. The right gossip to the right person means tips, reputation and evidence for the han. But careful: the psychic's and the dreamer's tales may be lies, never tell people gossip about themselves, and irrelevant talk annoys. An angry customer smashes a glass or gets up and chases you; run to Master Rıza's stove to be safe. The han side asks "anything else?" when you tell them the right thing. If the person you gossip about sits on the same floor, they may hear it and come after you. Selim's lot pay double, but that is betrayal.`},rulesAnger:{tr:"Sinir: yolunu kesen, tepsine çarpan, ayağına dolanan oldukça sinir göstergen dolar. Dolunca R ile tepsiyle vurabilirsin... ama patron Nadir Bey kameralardan izliyor. İtibarın düşer, üçüncüsünde maaşından keser. Bazen de bizzat teftişe çıkar: o kattayken kusursuz teslimleri görür, kırılan bardağı da görür. Teftişten iyi geçersen bahşiş bırakır. Ona vurmayı aklından bile geçirme.",en:"Anger: people blocking your way, bumping your tray and tripping you fill your anger meter. When it is full you can bonk them with the tray using R... but Nadir Bey is watching the cameras. Your reputation drops, and on the third time he docks your pay. Sometimes he inspects the floor in person: he sees every perfect delivery and every broken glass. Pass and he leaves you a tip. Do not even think about bonking him."},rulesRise:{tr:"Yükseliş: yıldız topladıkça, itibarın arttıkça ve kanıtları doğru yere ulaştırdıkça terfi edersin: Çırak → Ocakçı → Kat Çaycısı → Baş Çaycı → Han Çaycıbaşı → Çay Ocağı Patronu. Her unvan vardiya başına maaş getirir.",en:"The rise: earn stars, build your reputation and get the evidence to the right people t :8,text:{tr:'"Hepimiz arkandayız Cemal. Bildiğini söylersen biz de konuşuruz."',en:'"We all have your back, Cemal. If you speak up, so will we."'}},{id:"f_tabela",topic:"tapu",source:"hayri",about:["turgut"],truth:!0,story:!1,value:20,text:{tr:`"Turgut'un ofisinde kapının arkasında ikinci bir tabela var: 'Gökdelen Yapı'."`,en:`"Behind Turgut's door there's a second sign: 'Skyscraper Corp.'"`}},{id:"f_ask",topic:"kulis",source:"sevim",about:["sukran","ferhat"],truth:!0,story:!1,value:15,text:{tr:`"Şükran Hanım her gün Ferhat Bey'e çay ısmarlıyor. Bir şeyler var bunlarda."`,en:'"Mrs. Şükran buys Mr. Ferhat a tea every single day. Something is going on there."'}},{id:"f_takim",topic:"kulis",source:"sukran",about:["hayri"],truth:!0,story:!1,value:12,text:{tr:`"Hayri Usta, Nadir Bey'in takımının cebini ters dikmiş. Nadir Bey üç aydır fark etmedi."`,en:`"Master Hayri sewed Nadir Bey's suit pocket on upside down. Nadir Bey hasn't noticed in three months."`}},{id:"f_piyango",topic:"para",source:"nevin",about:["gulsum"],truth:!1,story:!1,value:15,text:{tr:'"Gülsüm Abla piyangodan büyük ikramiyeyi vurmuş, paspası da altın kaplatacakmış."',en:'"Gülsüm hit the lottery jackpot and is having her mop gold-plated."'}},{id:"f_hazine",topic:"para",source:"kerem",about:[],truth:!1,story:!1,value:15,text:{tr:`"Hanın bodrumunda Bizans hazinesi varmış abi. NFT'sini yapacağım, zengin olacağız."`,en:`"There's Byzantine treasure in the basement, bro. I'm minting it as an NFT, we'll be rich."`}},{id:"f_vergi",topic:"para",source:"kerem",about:["fikret"],truth:!1,story:!1,value:15,text:{tr:'"Fikret Bey vergi kaçırıyormuş, kesin duydum. Yani biri dedi ki duymuş."',en:'"Mr. Fikret dodges his taxes, I heard it for sure. Well, someone said they heard."'}},{id:"f_balik",topic:"kedi",source:"gulsum",about:["ferhat"],truth:!0,story:!1,value:12,text:{tr:`"Paşa'yı kim şişmanlatıyor biliyor musun? Ferhat Bey. Çekmecesinde hamsi saklıyor."`,en:`"You know who's fattening up Paşa? Mr. Ferhat. He keeps anc
