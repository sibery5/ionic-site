org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
android.suppressUnsupportedCompileSdk=36

# =====================================================================
#  DramaSeason uygulama ayarlari - degistirmeniz gereken yer burasi
# =====================================================================

# Debug (Android Studio'dan Run ile calistirma) surumunun acacagi adres.
# 10.0.2.2 = emulatorden bakildiginda bilgisayarinizin localhost'u (WAMP).
# Gercek telefonda test icin bilgisayarinizin yerel IP'sini yazin, ornek:
#   http://192.168.1.20/DramaSeason_R27_NEW/DramaSeason/
dramaseason.siteUrl.debug=http://10.0.2.2/DramaSeason_R27_NEW/DramaSeason/

# Yayin (release / APK-AAB) surumunun acacagi canli site adresi (https olmali).
# Bu deger degistirilmeden release derlemesi bilerek hata verir.
dramaseason.siteUrl.release=https://www.SITENIZ.com/

# Uygulamada acilmasi engellenecek admin paneli klasor/dosya adlari (virgulle).
# Ornek: /admin/, /admin.php, /yonetim/... hepsi engellenir, linkleri de gizlenir.
dramaseason.adminPaths=admin,yonetim,panel,administrator

# Uygulamanin icinde acilacak kripto odeme saglayicilari (virgulle, alt alan adlari dahil).
# Sitenizin kullandigi odeme sayfasi listede yoksa buraya ekleyin; yoksa odeme
# sayfasi telefonun tarayicisinda acilir (odeme yine calisir ama uye oturumu orada olmaz).
dramaseason.inAppHosts=nowpayments.io,coinpayments.net,commerce.coinbase.com,cryptomus.com,plisio.net,oxapay.com,coingate.com,pay.binance.com,cryptocloud.plus,heleket.com
